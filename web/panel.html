<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Atlas Signup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090a; --bg-2:#0b0c0e; --surface:#0e0f12; --surface-2:#131418;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --fg:#ededf0; --fg-2:#a1a3ad; --fg-3:#6b6d78;
  --brand:#6d8cff; --ok:#3ecf8e; --warn:#f5a524; --err:#ff5c5c;
  --r:12px; --r-sm:8px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
body{background:var(--bg);color:var(--fg);font:13px/1.6 var(--font);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 480px at 18% -12%,rgba(109,140,255,.10),transparent 62%),
             radial-gradient(700px 420px at 92% -6%,rgba(139,109,255,.07),transparent 60%)}
.shell{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:22px 22px 80px}
header{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#6d8cff,#8b6dff);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 18px -6px rgba(109,140,255,.7)}
.brand b{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--fg-3);font-size:11.5px;margin-left:2px}
.spacer{flex:1}
.status{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--fg-2)}
.led{width:5px;height:5px;border-radius:50%;background:var(--fg-3)}
.led.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);
  border-radius:var(--r);padding:18px 20px;margin-top:14px;transition:border-color .2s}
.card:hover{border-color:var(--line-2)}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);
  margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
button{font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:7px 13px;transition:all .15s}
button:hover{border-color:var(--line-2);background:#1a1c21}
button.primary{background:linear-gradient(180deg,#7b96ff,#5c78f0);border-color:#5c78f0;color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 6px 20px -10px rgba(109,140,255,.9)}
button.primary:hover{background:linear-gradient(180deg,#8aa2ff,#6a85f7)}
button.danger{color:#ffb3b3;border-color:rgba(255,92,92,.3);background:rgba(255,92,92,.08)}
button.danger:hover{background:rgba(255,92,92,.14)}
button:disabled{opacity:.4;cursor:not-allowed}
select,input,textarea{font:inherit;font-size:12.5px;background:var(--bg-2);border:1px solid var(--line);
  color:var(--fg);border-radius:var(--r-sm);padding:8px 11px;outline:none;width:100%;transition:.15s}
select:focus,input:focus,textarea:focus{border-color:rgba(109,140,255,.55);box-shadow:0 0 0 3px rgba(109,140,255,.12)}
.controls{display:grid;grid-template-columns:auto auto auto 1fr;gap:14px;align-items:end}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label{font-size:10.5px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.ctl input{width:84px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--bg-2)}
.seg button{border:none;border-radius:0;background:transparent;color:var(--fg-3);padding:8px 15px;font-size:12px}
.seg button.on{background:rgba(109,140,255,.14);color:#b9c6ff;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.stat{background:var(--bg-2);padding:14px 16px}
.stat .k{font-size:10.5px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.stat .v{font-size:21px;font-weight:600;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v.ok{color:var(--ok)} .stat .v.err{color:var(--err)} .stat .v.brand{color:#9db0ff}
.progress{height:4px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;margin:14px 0 6px}
.progress span{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#6d8cff,#8b6dff);transition:width .35s ease;
  box-shadow:0 0 12px rgba(109,140,255,.5)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);
  font-weight:600;padding:0 0 10px;border-bottom:1px solid var(--line)}
td{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.hover:hover td{background:rgba(255,255,255,.012)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--fg-3)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;padding:2px 8px;
  border-radius:5px;border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:rgba(62,207,142,.28);background:rgba(62,207,142,.09)}
.tag.err{color:var(--err);border-color:rgba(255,92,92,.28);background:rgba(255,92,92,.09)}
.tag.run{color:#9db0ff;border-color:rgba(109,140,255,.28);background:rgba(109,140,255,.09)}
.tag.dim{color:var(--fg-3)}
.bar{width:110px;height:3px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden;
  display:inline-block;vertical-align:middle;margin-right:9px}
.bar span{display:block;height:100%;background:#6d8cff;border-radius:999px;transition:width .3s}
.bar.ok span{background:var(--ok)} .bar.err span{background:var(--err)}
.stage{font-size:11.5px;color:var(--fg-2)}
.logbox{height:200px;overflow:auto;background:#06070a;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.75;color:#8b93a1}
.logbox .t{color:#3a3f4a;margin-right:9px}
.logbox .ok{color:var(--ok)} .logbox .err{color:var(--err)}
details{margin-top:4px}
summary{cursor:pointer;color:var(--fg-3);font-size:11.5px;list-style:none;padding:6px 0;user-select:none;
  display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸";transition:transform .2s;font-size:10px}
details[open] summary:before{transform:rotate(90deg)}
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cfg .full{grid-column:1/-1}
.cfg .ctl input,.cfg .ctl select,.cfg .ctl textarea{width:100%}
.hint{font-size:11.5px;color:var(--fg-3);margin-top:9px;line-height:1.6}
code{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,.05);padding:1px 6px;border-radius:4px;color:#b9c6ff}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:#191b20;border:1px solid var(--line-2);color:var(--fg);padding:9px 16px;border-radius:9px;
  font-size:12.5px;opacity:0;transition:.22s;pointer-events:none;z-index:99;box-shadow:0 12px 32px -12px #000}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.cfg{grid-template-columns:1fr}
  .controls{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="mark">A</div>
      <div><b>Atlas Signup</b><span>批量开号 → 自动入池</span></div>
    </div>
    <div class="spacer"></div>
    <div class="status"><span class="led" id="led"></span><span id="statusText">空闲</span></div>
    <button onclick="location.href='http://127.0.0.1:8790/'" style="margin-left:10px">账号池 →</button>
  </header>

  <div class="card">
    <div class="eyebrow">任务</div>
    <div class="controls">
      <div class="ctl"><label>模式</label>
        <div class="seg" id="seg">
          <button data-mode="demo" class="on">演示</button>
          <button data-mode="live">实跑</button>
        </div>
      </div>
      <div class="ctl"><label>数量</label><input id="count" type="number" value="3" min="1" max="500"/></div>
      <div class="ctl"><label>并发</label><input id="conc" type="number" value="2" min="1" max="6"/></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="primary" id="startBtn" onclick="start()">开始</button>
        <button class="danger" id="stopBtn" onclick="stop()" disabled>停止</button>
        <button onclick="location.href='/api/export'">导出</button>
      </div>
    </div>
    <div class="hint">演示模式不联网、不花钱，用于确认流程；实跑按下方「账号源」逐个注册，成功后自动签发 API Key 并入池。</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">任务</div><div class="v" id="sTotal">0</div></div>
    <div class="stat"><div class="k">成功</div><div class="v ok" id="sOk">0</div></div>
    <div class="stat"><div class="k">失败</div><div class="v err" id="sFail">0</div></div>
    <div class="stat"><div class="k">积分</div><div class="v brand" id="sCredit">0</div></div>
    <div class="stat"><div class="k">耗时</div><div class="v" id="sElapsed">0s</div></div>
  </div>

  <div class="card" style="margin-top:0">
    <div class="eyebrow">进度 <span class="muted" id="pText" style="text-transform:none;letter-spacing:0;font-weight:400">等待开始</span></div>
    <div class="progress"><span id="pbar"></span></div>
    <table style="margin-top:12px">
      <thead><tr><th style="width:34px">#</th><th>邮箱</th><th style="width:240px">阶段</th><th style="width:70px">积分</th><th style="width:72px">状态</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="muted" style="padding:16px 0">还没有任务</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <div class="eyebrow">日志</div>
    <div class="logbox" id="logs"><span class="muted">等待开始…</span></div>
  </div>

  <div class="card">
    <div class="eyebrow">账号源 <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">一行一个：邮箱----密码</span></div>
    <textarea id="pool" rows="4" placeholder="a@hotmail.com----password&#10;b@hotmail.com----password" style="font-family:var(--mono);font-size:12px"></textarea>
    <div class="hint">留空则使用「配置」里的 hotmail。批量开号按此列表逐个注册，成功后自动签 <code>wl_live_…</code> 并入池。</div>
  </div>

  <div class="card">
    <div class="eyebrow">配置</div>
    <div class="cfg">
      <div class="ctl"><label>邮箱来源</label>
        <select id="mailProvider">
          <option value="msowa">hotmail（浏览器登录接码）</option>
          <option value="imap">IMAP（自有域名 catch-all）</option>
          <option value="http">HTTP 收件箱（Email Worker）</option>
        </select></div>
      <div class="ctl"><label>接码平台 Key</label><input id="smsKey" placeholder="hero-sms api_key"/></div>
      <div class="ctl"><label>打码服务 Key（可选）</label><input id="captchaKey" placeholder="留空则浏览器自动过 Turnstile"/></div>
      <div class="ctl"><label>代理</label><input id="proxy" placeholder="http://127.0.0.1:7890"/></div>
      <div class="ctl full"><label>账号池地址（注册成功后自动入池）</label>
        <input id="poolUrl" placeholder="http://127.0.0.1:8790"/></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="primary" onclick="saveCfg()">保存配置</button>
      <button onclick="loadCfg()">重新读取</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const fmt = n => (n||0).toLocaleString('en-US');
let MODE='demo', LAST='';

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1700); }

document.querySelectorAll('#seg button').forEach(b=>{
  b.onclick=()=>{ MODE=b.dataset.mode;
    document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
    $('startBtn').textContent = MODE==='demo'?'开始演示':'开始注册'; };
});

async function start(){
  const r=await fetch('/api/start',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({mode:MODE, count:+$('count').value, concurrency:+$('conc').value,
                         pool:$('pool').value})});
  const d=await r.json();
  if(!d.ok) toast(d.error||'启动失败');
}
async function stop(){ await fetch('/api/stop',{method:'POST'}); }

async function loadCfg(){
  const c=await (await fetch('/api/config')).json();
  $('mailProvider').value=c.mail.provider||'msowa';
  $('smsKey').value=c.sms.api_key||'';
  $('captchaKey').value=c.captcha.api_key||'';
  $('proxy').value=(c.run.proxies||[])[0]||'';
  $('poolUrl').value=c.atlas?.pool_url||'http://127.0.0.1:8790';
}
async function saveCfg(){
  await fetch('/api/config',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({
      mail:{provider:$('mailProvider').value},
      sms:{api_key:$('smsKey').value},
      captcha:{api_key:$('captchaKey').value},
      run:{proxies:$('proxy').value},
      atlas:{pool_url:$('poolUrl').value}
    })});
  toast('已保存');
}

async function poll(){
  let d; try{ d=await (await fetch('/api/state')).json(); }catch(e){ return; }
  const s=d.stats;
  $('sTotal').textContent=s.total; $('sOk').textContent=s.ok;
  $('sFail').textContent=s.failed; $('sCredit').textContent=fmt(s.credits);
  $('sElapsed').textContent=(s.elapsed||0).toFixed(0)+'s';
  $('startBtn').disabled=s.running_batch; $('stopBtn').disabled=!s.running_batch;
  $('led').className='led'+(s.running_batch?' live':'');
  $('statusText').textContent = s.running_batch ? '运行中' : (s.total? '已结束':'空闲');

  const done=s.ok+s.failed, pct=s.total?Math.round(done/s.total*100):0;
  $('pbar').style.width=pct+'%';
  $('pText').textContent = s.total ? `${done}/${s.total} 完成 · ${s.running} 进行中` : '等待开始';

  $('rows').innerHTML = d.tasks.length ? d.tasks.map(t=>{
    const cls=t.status==='ok'?'ok':(t.status==='failed'?'err':'');
    const tag=t.status==='ok'?'<span class="tag ok">成功</span>'
      :t.status==='failed'?'<span class="tag err">失败</span>'
      :t.status==='running'?'<span class="tag run">进行中</span>'
      :t.status==='stopped'?'<span class="tag dim">停止</span>':'<span class="tag dim">排队</span>';
    return `<tr class="hover"><td class="mono muted">${t.idx}</td>
      <td class="mono">${t.email||'<span class="muted">等待分配</span>'}</td>
      <td><span class="bar ${cls}"><span style="width:${t.progress}%"></span></span>
          <span class="stage">${t.stage_label}</span></td>
      <td class="mono" style="color:${t.credits?'var(--ok)':'var(--fg-3)'}">${t.credits?fmt(t.credits):'—'}</td>
      <td>${tag}</td></tr>`;
  }).join('') : '<tr><td colspan="5" class="muted" style="padding:16px 0">还没有任务</td></tr>';

  const html=d.logs.map(l=>`<div class="${l.level}"><span class="t">${l.t}</span>${l.msg}</div>`).join('');
  if(html!==LAST){
    const box=$('logs'); const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<50;
    box.innerHTML=html||'<span class="muted">等待开始…</span>'; LAST=html;
    if(atBottom) box.scrollTop=box.scrollHeight;
  }
}

loadCfg(); poll(); setInterval(poll,900);
</script>
</body>
</html>
